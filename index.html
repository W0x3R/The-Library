<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/The-Library/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/The-Library/assets/favicon.svg" />
    <link rel="shortcut icon" href="/The-Library/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/The-Library/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bools Catalogue" />
    <link rel="manifest" href="/The-Library/assets/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Library</title>
    <script type="module" crossorigin src="/The-Library/main.js"></script>
    
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="container">
          <div class="header-inner">
            <a class="logo__link" href="/">
              <div class="logo__img-wrapper">
                <img
                  src="data:image/svg+xml,%3csvg%20width='24'%20height='24'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M12%207v14M3%2018a1%201%200%2001-1-1V4a1%201%200%20011-1h5a4%204%200%20014%204%204%204%200%20014-4h5a1%201%200%20011%201v13a1%201%200%2001-1%201h-6a3%203%200%2000-3%203%203%203%200%2000-3-3H3z'%20stroke='%23F8F6F1'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3c/svg%3e"
                  alt="book"
                  class="logo__img"
                  width="20"
                  height="20"
                />
              </div>
              <div class="logo__text-wrapper">
                <p class="logo__text">The Library</p>
                <p class="logo__subtext">Discover your next favorite book</p>
              </div>
            </a>
            <button class="header__theme-switcher" title="Switch theme"></button>
          </div>
        </div>
      </header>
      <div class="main">
        <section>
          <div class="container">
            <div class="library">
              <h1 class="library__title">Discover Your Next Great Read</h1>
              <p class="library__subtitle">
                Search millions of books, build your personal library, and never lose track of what
                to read next.
              </p>
              <form class="library__form">
                <div class="library__form-wrapper">
                  <input
                    class="library__form-input"
                    placeholder="Search for books by title or author..."
                    maxlength="30"
                  />
                  <img
                    class="library__form-logo"
                    src="data:image/svg+xml,%3csvg%20width='20'%20height='20'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M9.167%2015.833a6.667%206.667%200%20100-13.333%206.667%206.667%200%20000%2013.333zM17.5%2017.5l-3.583-3.583'%20stroke='%237C736A'%20stroke-width='1.667'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3c/svg%3e"
                    alt=""
                    width="20"
                    height="20"
                  />
                  <button class="library__search-btn" type="button">Search</button>
                </div>
                <div class="library__form-wrapper library__author-wrapper">
                  <input
                    class="library__form-input library__author-input"
                    placeholder="Filter books by author..."
                    maxlength="30"
                  />
                  <img
                    class="library__form-logo"
                    src="data:image/svg+xml,%3csvg%20width='20'%20height='20'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M9.167%2015.833a6.667%206.667%200%20100-13.333%206.667%206.667%200%20000%2013.333zM17.5%2017.5l-3.583-3.583'%20stroke='%237C736A'%20stroke-width='1.667'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3c/svg%3e"
                    alt=""
                    width="20"
                    height="20"
                  />
                </div>
                <p class="library__form-error">Please enter a search query.</p>
              </form>
              <div class="library__layout">
                <div class="books-wrapper"></div>
                <div class="loader">
                  <p class="loader__message">Loading...</p>
                  <img
                    class="loader__img"
                    src="data:image/svg+xml,%3csvg%20width='24'%20height='24'%20viewBox='0%200%2024%2024'%20xmlns='http://www.w3.org/2000/svg'%20fill='%23ef4444'%3e%3cstyle%3e.spinner_hzlK{animation:spinner_vc4H%20.8s%20linear%20infinite;animation-delay:-.8s}.spinner_koGT{animation-delay:-.65s}.spinner_YF1u{animation-delay:-.5s}@keyframes%20spinner_vc4H{0%25{y:1px;height:22px}93.75%25{y:5px;height:14px;opacity:.2}}%3c/style%3e%3crect%20class='spinner_hzlK'%20x='1'%20y='1'%20width='6'%20height='22'/%3e%3crect%20class='spinner_hzlK%20spinner_koGT'%20x='9'%20y='1'%20width='6'%20height='22'/%3e%3crect%20class='spinner_hzlK%20spinner_YF1u'%20x='17'%20y='1'%20width='6'%20height='22'/%3e%3c/svg%3e"
                    alt="loading"
                    width="60"
                    height="60"
                  />
                </div>
                <div class="error">
                  <img class="error__img" src="" alt="" width="225" height="225" />
                  <p class="error__heading"></p>
                  <p class="error__subheading"></p>
                </div>
                <aside class="favorites">
                  <div class="favorites__heading">
                    <div class="favorites__heading-logo-wrapper">
                      <img
                        src="data:image/svg+xml,%3csvg%20width='16'%20height='16'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M12.667%209.333c.993-.973%202-2.14%202-3.666A3.667%203.667%200%200011%202c-1.173%200-2%20.333-3%201.333C7%202.333%206.173%202%205%202a3.667%203.667%200%2000-3.667%203.667c0%201.533%201%202.7%202%203.666L8%2014l4.667-4.667z'%20stroke='%2327694d'%20stroke-width='1.333'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3c/svg%3e"
                        alt=""
                        width="16"
                        height="16"
                        class="favorites__heading-logo"
                      />
                    </div>
                    <div>
                      <h3 class="favorites__heading-title">Favorites</h3>
                      <p class="favorites__heading-subtitle">3 Books saved</p>
                    </div>
                  </div>
                  <div class="favorites__books-wrapper"></div>
                  <p class="favorites__error">No selected books</p>
                </aside>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
