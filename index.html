<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bools Catalogue" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Library</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="container">
          <div class="header-inner">
            <a class="logo__link" href="/">
              <div class="logo__img-wrapper">
                <img
                  src="/assets/icons/book.svg"
                  alt="book"
                  class="logo__img"
                  width="20"
                  height="20"
                />
              </div>
              <div class="logo__text-wrapper">
                <p class="logo__text">The Library</p>
                <p class="logo__subtext">Discover your next favorite book</p>
              </div>
            </a>
            <button
              class="header__theme-switcher"
              title="Switch theme"
            ></button>
          </div>
        </div>
      </header>
      <div class="main">
        <section>
          <div class="container">
            <div class="library__inner">
              <h1 class="library__title">Discover Your Next Great Read</h1>
              <p class="library__subtitle">
                Search millions of books, build your personal library, and never
                lose track of what to read next.
              </p>
              <form class="library__form">
                <div class="library__form-wrapper">
                  <input
                    class="library__form-input"
                    placeholder="Search for books by title or author..."
                    maxlength="30"
                  />
                  <img
                    class="library__form-logo"
                    src="/assets/icons/search.svg"
                    alt=""
                    width="20"
                    height="20"
                  />
                </div>
                <button class="library__search-btn" type="button">
                  Search
                </button>
              </form>
              <div class="library__layout">
                <div class="books-wrapper"></div>
                <div class="loader">
                  <p class="loader__message">Loading...</p>
                  <img
                    class="loader__img"
                    src="./assets/icons/loader.svg"
                    alt="loading"
                    width="60"
                    height="60"
                  />
                </div>
                <div class="error">
                  <img
                    class="error__img"
                    src=""
                    alt=""
                    width="225"
                    height="225"
                  />
                  <p class="error__heading"></p>
                  <p class="error__subheading"></p>
                </div>
                <aside class="favorites">
                  <div class="favorites__heading">
                    <div class="favorites__heading-logo-wrapper">
                      <img
                        src="/assets/icons/heart.svg"
                        alt=""
                        width="16"
                        height="16"
                        class="favorites__heading-logo"
                      />
                    </div>
                    <div>
                      <h3 class="favorites__heading-title">Favorites</h3>
                      <p class="favorites__heading-subtitle">3 Books saved</p>
                    </div>
                  </div>
                  <div class="favorites__books-wrapper">
                    <article>
                      <figure class="favorites__books-item">
                        <img
                          src="https://placehold.co/70x110?&font=oswald&text=%D0%9D%D0%B0%D1%87%D0%B0%D0%BB%D0%BE"
                          alt=""
                          class="favorites__books-banner"
                        />
                        <div class="favorites__books-description">
                          <h4 class="favorites__books-title">The Hobbit</h4>
                          <p class="favorites__books-author">J.R.R Tolken</p>
                          <p class="favorites__books-year">1995</p>
                        </div>
                        <button
                          class="favorites__books-btn"
                          title="Remove from favorite"
                        >
                          <svg
                            width="16"
                            height="16"
                            fill="red"
                            xmlns="http://www.w3.org/2000/svg"
                          >
                            <path
                              d="M12.667 9.333c.993-.973 2-2.14 2-3.666A3.667 3.667 0 0011 2c-1.173 0-2 .333-3 1.333C7 2.333 6.173 2 5 2a3.667 3.667 0 00-3.667 3.667c0 1.533 1 2.7 2 3.666L8 14l4.667-4.667z"
                              stroke-width="1.333"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                            />
                          </svg>
                        </button>
                      </figure>
                    </article>
